# Runs every test on each push and pull request (the same as `bash tests/run_tests.sh` on your machine).
# Nothing real is touched: the tests use temporary queues and a simulated Slurm cluster.
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml shellcheck libegl1 libxkbcommon0 libdbus-1-3 > /dev/null
          python3 -m pip install --quiet --break-system-packages pyflakes PyQt6
      - name: lint
        run: |
          python3 -m pyflakes src/lib/mysys/*.py src/bin/ms tests/*.py | grep -v "imported but unused" | (! grep .)
          shellcheck -S warning src/bin/*.sh install.sh uninstall.sh docs/*.sh tests/live/*.sh
      - name: tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash tests/run_tests.sh
